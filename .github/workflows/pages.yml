# Демо-стенд на GitHub Pages: статическая сборка без серверной части.
# Заявка в демо не отправляется — номер выдаётся в браузере, экран успеха и PDF работают.
name: Демо на GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Обработчики заявок (src/app/api) в статическую сборку не входят.
      - run: rm -rf src/app/api
      - run: npx next build
        env:
          STATIC_EXPORT: '1'
          NEXT_PUBLIC_DEMO: '1'
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
      - run: touch out/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
